/* ---------- FadingVideo: rAF-driven crossfade loop ---------- */
const FADE_MS = 500, FADE_OUT_LEAD = 0.55;
function FadingVideo({ src, className, style }) {
  const ref = useRef(null), raf = useRef(0), fadingOut = useRef(false);
  useEffect(() => {
    const v = ref.current; if (!v) return;
    let timer;
    const fadeTo = (target, duration = FADE_MS) => {
      cancelAnimationFrame(raf.current);
      const from = parseFloat(v.style.opacity || "0"), t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / duration);
        v.style.opacity = String(from + (target - from) * p);
        if (p < 1) raf.current = requestAnimationFrame(step);
      };
      raf.current = requestAnimationFrame(step);
    };
    const onLoaded = () => { v.style.opacity = "0"; v.play().catch(() => {}); fadeTo(1); };
    const onTime = () => {
      const left = v.duration - v.currentTime;
      if (!fadingOut.current && left <= FADE_OUT_LEAD && left > 0) { fadingOut.current = true; fadeTo(0); }
    };
    const onEnded = () => {
      v.style.opacity = "0";
      timer = setTimeout(() => { v.currentTime = 0; v.play().catch(() => {}); fadingOut.current = false; fadeTo(1); }, 100);
    };
    v.addEventListener("loadeddata", onLoaded);
    v.addEventListener("timeupdate", onTime);
    v.addEventListener("ended", onEnded);
    return () => {
      cancelAnimationFrame(raf.current); clearTimeout(timer);
      v.removeEventListener("loadeddata", onLoaded);
      v.removeEventListener("timeupdate", onTime);
      v.removeEventListener("ended", onEnded);
    };
  }, [src]);
  return html`<video ref=${ref} src=${src} autoPlay muted playsInline preload="auto" className=${className} style=${{ ...style, opacity: 0 }}></video>`;
}

/* ---------- Starfield: always-on backdrop under the video ---------- */
function Starfield() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w, h, stars = [], id, dpr = Math.min(2, window.devicePixelRatio || 1);
    const resize = () => {
      w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.round(w * h / 3200) }, () => ({ x: Math.random() * w, y: Math.random() * h, z: Math.random(), p: Math.random() * 6.28 }));
    };
    let shoot = null;
    const draw = t => {
      ctx.clearRect(0, 0, w, h);
      if (!reduce && !shoot && Math.random() < 0.004) shoot = { x: Math.random() * w * 0.8, y: Math.random() * h * 0.4, life: 0 };
      if (shoot) {
        const len = 120, k = shoot.life / 60, x = shoot.x + shoot.life * 9, y = shoot.y + shoot.life * 3.2;
        const g = ctx.createLinearGradient(x, y, x - len, y - len * 0.36);
        g.addColorStop(0, `rgba(255,255,255,${0.9 * (1 - k)})`); g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y - len * 0.36); ctx.stroke();
        if (++shoot.life > 60) shoot = null;
      }
      for (const s of stars) {
        const a = 0.25 + 0.75 * s.z * (0.6 + 0.4 * Math.sin(t / 900 + s.p));
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        const r = 0.4 + s.z * 1.1;
        ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.28); ctx.fill();
        if (!reduce) { s.y -= 0.03 + s.z * 0.12; if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; } }
      }
      if (!reduce) id = requestAnimationFrame(draw);
    };
    resize(); window.addEventListener("resize", resize); id = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(id); window.removeEventListener("resize", resize); };
  }, []);
  return html`<canvas ref=${ref} class="absolute inset-0 h-full w-full" aria-hidden="true"></canvas>`;
}

/* ---------- BlurText: word-by-word blur-in ---------- */
function BlurText({ text, className = "" }) {
  const ref = useRef(null); const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (!("IntersectionObserver" in window)) { setSeen(true); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: 0.1 });
    io.observe(el); return () => io.disconnect();
  }, []);
  const words = text.split(" ");
  return html`<p ref=${ref} className=${className} style=${{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
    ${words.map((w, i) => html`<${motion.span} key=${i}
      initial=${{ filter: "blur(10px)", opacity: 0, y: 50 }}
      animate=${seen ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] } : undefined}
      transition=${{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
      style=${{ display: "inline-block", marginRight: "0.28em" }}>${w}<//>`)}
  </p>`;
}

function DashCard({ d, myKey, setKey, onTag }) {
  const k = myKey || d.demo;
  const ex = d.ex.split("{KEY}").join(k ? encodeURIComponent(k) : "YOUR_KEY");
  const needsKey = d.auth === "k" || d.ex.includes("{KEY}");
  const badge = d.auth === "n" ? "bg-white text-black" : d.auth === "d" ? "bg-neutral-800 text-white" : "text-white/80 ring-1 ring-white/40";

    <div class="mt-auto flex flex-wrap gap-2 pt-1">
      <a href=${d.auth === "k" ? d.docs : ex} target="_blank" rel="noopener" class="flex items-center gap-1.5 rounded-full bg-white px-5 py-2.5 text-sm text-black transition-colors hover:bg-neutral-200">${d.auth === "k" ? "get your free key" : "try it now"} <${ArrowUpRight} c="h-4 w-4" /></a>

    </div>

}

const stem = w => w.toLowerCase().replace(/(ing|es|s)$/, "");
function matches(d, q) {
  if (!q) return true;
  const hay = (d.name + " " + d.cat + " " + d.tags.join(" ") + " " + d.desc).toLowerCase();
  const stems = hay.split(/[^a-z0-9]+/).map(stem);
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t) || stems.includes(stem(t)));
}

function DashCatalog({ q, setQ, cat, setCat, auth, setAuth, keys, setKey }) {
  const qd = q.trim();
  const base = DATA.filter(d => (auth === "all" || (auth === "n" ? d.auth !== "k" : d.auth === auth)) && matches(d, qd));
  const list = base.filter(d => cat === "All" || d.cat === cat);
  const groups = [["n", "works instantly", "no sign-up and no key"], ["d", "public test key", "official shared keys, copy and go"], ["k", "free key required", "sign up free, paste your key, the example fills in"]];
  const onTag = t => { setQ(t); setCat("All"); document.getElementById("catalog").scrollIntoView({ behavior: "smooth" }); };
  const pill = on => "shrink-0 whitespace-nowrap rounded-full px-4 py-2 text-sm transition-colors " + (on ? "bg-white text-black" : "bg-neutral-900/90 text-neutral-300 hover:text-white");
  return html`<section id="catalog" class="relative min-h-screen scroll-mt-4 bg-black px-4 pb-20 pt-28 md:px-10">
    <div class="relative mx-auto max-w-[1400px]">
      <div class="relative mb-10 min-h-[11rem] md:min-h-[15rem]">

      <div class="sticky top-[68px] z-20 -mx-4 bg-black px-4 pb-3 pt-2 md:top-[80px] md:-mx-10 md:px-10">
        <label class="flex items-center gap-3 rounded-full bg-neutral-900/95 py-2 pl-5 pr-2 ring-1 ring-white/10 backdrop-blur focus-within:ring-white/50">
          <${Search} />
          <input id="cat-q" type="search" value=${q} onChange=${e => setQ(e.target.value)} placeholder="search anime, game, weather…" aria-label="Search APIs" class="min-w-0 flex-1 bg-transparent py-2 text-base text-white outline-none md:text-lg" />
          ${q && html`<button onClick=${() => setQ("")} class="shrink-0 rounded-full bg-neutral-800 px-4 py-2 text-xs text-neutral-300 transition-colors hover:text-white">clear</button>`}
          <span class="hidden shrink-0 rounded-full bg-white px-5 py-2.5 text-sm tabular-nums text-black sm:block">${list.length} of ${DATA.length}</span>
        </label>
      </div>
      <div class="mt-4 flex flex-wrap items-center gap-2">
        ${["anime", "game", "movie", "weather", "crypto", "music", "ai", "cricket"].map(w => html`<button key=${w} onClick=${() => { setQ(w); setCat("All"); }} class=${"rounded-full px-3 py-1 text-xs transition-colors " + (qd === w ? "bg-white text-black" : "text-white/60 ring-1 ring-white/20 hover:text-white")}>${w}</button>`)}
      </div>
      <div class="scroll-x mt-4 flex gap-2 pb-1" role="group" aria-label="Categories">
        ${CATS.map(c => { const n = c === "All" ? base.length : base.filter(d => d.cat === c).length; if (qd && !n && c !== cat) return null;
          return html`<button key=${c} aria-pressed=${cat === c} onClick=${() => setCat(c)} class=${pill(cat === c)}>${c.toLowerCase()} <span class="ml-1 text-xs opacity-50">${n}</span></button>`; })}
      </div>
      <div class="mt-2 flex flex-wrap items-center gap-2" role="group" aria-label="Key filter">
        ${[["all", "all apis"], ["n", "no key needed"], ["d", "public key"], ["k", "needs free key"]].map(([k, t]) => html`<button key=${k} aria-pressed=${auth === k} onClick=${() => setAuth(k)} class=${pill(auth === k) + " text-xs"}>${t}</button>`)}
      </div>

      ${list.length === 0 && html`<div class="mt-12 rounded-[1.75rem] bg-neutral-900/90 p-10 text-center text-white/80">no apis match “${qd.toLowerCase()}”. try a broader word like game, music or images, or pick all.</div>`}
      ${groups.map(([a, h, p]) => { const g = list.filter(d => d.auth === a); if (!g.length) return null;
        return html`<div key=${a} class="mt-14">
          <div class="mb-5 flex flex-wrap items-end justify-between gap-x-6 gap-y-2">
            <h3 class="hero-title text-5xl font-medium text-white md:text-6xl">${h}</h3>
            <div class="flex items-center gap-3"><${Divider} rot="rotate-[-20deg]" /><span class="text-3xl font-medium tracking-tight">${g.length}</span><span class="text-xs text-white/60 md:text-sm">${p}</span></div>

          <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">${g.map(d => html`<${DashCard} key=${d.id} d=${d} myKey=${keys[d.id]} setKey=${setKey} onTag=${onTag} />`)}</div>

        <p class="max-w-[70ch] leading-relaxed">why some keys aren't shown: most api keys are personal. they belong to one account, and sharing them breaks the provider's terms and gets them blocked. so api hub gives you the no-key apis ready to use, the official public test keys, and a direct link to get your own free key for everything else. keys you paste are stored only in this browser, under your account.</p>
      </footer>
    </div>
  </section>`;
}

/* ---------- App ---------- */
function App() {
  const [user, setUser] = useState(() => LIVE ? null : store.get("apihub.session", null));
  const [ready, setReady] = useState(!LIVE || !fbAuth);
  useEffect(() => { if (!LIVE || !fbAuth) return; return fbAuth.onAuthStateChanged(u => { setUser(fbUser(u)); setReady(true); }); }, []);
  const [q, setQ] = useState(""), [cat, setCat] = useState("All"), [auth, setAuth] = useState("all");
  const [keys, setKeys] = useState({});
  useEffect(() => { if (user) setKeys((store.get("apihub.keys", {})[user.id]) || {}); }, [user]);
  const signIn = u => {
    if (LIVE) { setUser(u); window.scrollTo(0, 0); return; }
    const users = store.get("apihub.users", {}); users[u.id] = Object.assign(users[u.id] || { created: Date.now() }, u); store.set("apihub.users", users);
    store.set("apihub.session", u); setUser(u); window.scrollTo(0, 0);
  };
  const logout = () => { if (LIVE && fbAuth) fbAuth.signOut(); else store.set("apihub.session", null); setUser(null); window.scrollTo(0, 0); };
  const setKey = (id, v) => setKeys(prev => {
    const next = { ...prev }; if (v) next[id] = v; else delete next[id];
    const all = store.get("apihub.keys", {}); all[user.id] = next; store.set("apihub.keys", all); return next;
  });
  const onJump = (term, a) => { if (term !== undefined) setQ(term); setCat("All"); setAuth(a || "all"); };
  return html`<div class="min-h-screen overflow-x-clip bg-black font-body text-white">
    ${!ready ? null : user ? html`<div class="dash">
      <${DashNav} user=${user} onLogout=${logout} onJump=${onJump} />
      <${DashHero} user=${user} onLogout=${logout} />
      <${DashCatalog} q=${q} setQ=${setQ} cat=${cat} setCat=${setCat} auth=${auth} setAuth=${setAuth} keys=${keys} setKey=${setKey} />
    </div>`
    : html`<${Gate} onSignIn=${signIn} />`}
    <${Toast} />
  </div>`;
}

RD.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
